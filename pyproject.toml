[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcf-lca-engine"
version = "1.0.0"
description = "ISO 14067 product carbon footprint engine: BOM-to-emission-factor matching, data quality, uncertainty and Scope 3 roll-up"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "duckdb>=1.0", "ruff>=0.5"]

[project.scripts]
pcf = "pcf.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E731", "B905"]
